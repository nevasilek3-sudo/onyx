<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign In - AppleSkin</title>
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <div class="container" style="max-width:420px;">
    <div style="text-align:center;margin:40px 0 20px;">
      <a href="/" class="header-logo" style="font-size:2rem;">AppleSkin</a>
    </div>
    <div class="card">
      <h2 style="text-align:center;">Sign In</h2>
      <div id="error" class="alert alert-error" style="display:none;"></div>
      <form id="loginForm">
        <div class="form-group">
          <label>Email</label>
          <input type="email" id="email" required placeholder="your@email.com">
        </div>
        <div class="form-group">
          <label>Password</label>
          <input type="password" id="password" required placeholder="Password">
        </div>
        <button type="submit" class="btn btn-primary" style="width:100%;margin-top:8px;">Sign In</button>
      </form>
      <p style="text-align:center;margin-top:16px;color:var(--text-secondary);font-size:0.9rem;">
        No account? <a href="/register" style="color:var(--accent);">Sign Up</a>
      </p>
    </div>
  </div>
  <script>
    document.getElementById('loginForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const errEl = document.getElementById('error');
      errEl.style.display = 'none';
      const btn = e.target.querySelector('button');
      btn.disabled = true; btn.textContent = 'Loading...';

      try {
        const res = await fetch('/api/auth/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            email: document.getElementById('email').value,
            password: document.getElementById('password').value,
          }),
        });
        const data = await res.json();
        if (!res.ok) { throw new Error(data.error || 'Login failed'); }
        localStorage.setItem('token', data.token);
        localStorage.setItem('user', JSON.stringify(data.user));
        window.location.href = '/dashboard';
      } catch (err) {
        errEl.textContent = err.message;
        errEl.style.display = 'block';
      } finally {
        btn.disabled = false; btn.textContent = 'Sign In';
      }
    });
  </script>
</body>
</html>
