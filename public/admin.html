<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin - AppleSkin</title>
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <div class="container">
    <div class="header">
      <a href="/" class="header-logo">AppleSkin <span style="font-size:0.8rem;color:var(--danger);">ADMIN</span></a>
      <div class="header-nav">
        <span id="userBadge" style="font-size:0.9rem;color:var(--text-secondary);"></span>
        <button class="btn btn-outline btn-sm" onclick="location.href='/dashboard'">Dashboard</button>
        <button class="btn btn-outline btn-sm" onclick="logout()">Logout</button>
      </div>
    </div>

    <div id="error" class="alert alert-error" style="display:none;"></div>
    <div id="success" class="alert alert-success" style="display:none;"></div>

    <div class="card">
      <h2>Statistics</h2>
      <div class="stat-grid">
        <div class="stat-card"><div class="stat-value" id="statUsers">-</div><div class="stat-label">Total Users</div></div>
        <div class="stat-card"><div class="stat-value" id="statActive">-</div><div class="stat-label">Active Subs</div></div>
        <div class="stat-card"><div class="stat-value" id="statUsedKeys">-</div><div class="stat-label">Keys Used</div></div>
        <div class="stat-card"><div class="stat-value" id="statToday">-</div><div class="stat-label">New Today</div></div>
      </div>
    </div>

    <div class="card">
      <h2>JAR Management</h2>
      <p style="color:var(--text-secondary);font-size:0.9rem;margin-bottom:12px;">
        Upload a new JAR file for users to download.
      </p>
      <div id="jarInfo" style="margin-bottom:12px;color:var(--text-secondary);font-size:0.9rem;"></div>
      <div style="display:flex;gap:10px;flex-wrap:wrap;align-items:center;">
        <input type="file" id="jarInput" accept=".jar" style="display:none;">
        <button class="btn btn-outline btn-sm" onclick="document.getElementById('jarInput').click()">Choose JAR</button>
        <button class="btn btn-success btn-sm" onclick="uploadJar()">Upload</button>
      </div>
    </div>

    <div class="card">
      <h2>Generate License Keys</h2>
      <div style="display:flex;gap:10px;flex-wrap:wrap;align-items:end;">
        <div class="form-group" style="flex:1;min-width:120px;">
          <label>Count</label>
          <input type="number" id="keyCount" value="10" min="1" max="1000">
        </div>
        <div class="form-group" style="flex:1;min-width:120px;">
          <label>Duration (days)</label>
          <input type="number" id="keyDuration" value="30" min="1" max="3650">
        </div>
        <button class="btn btn-success" onclick="generateKeys()">Generate</button>
      </div>
      <div id="keysOutput" style="margin-top:12px;display:none;">
        <textarea id="keysText" readonly style="width:100%;height:120px;background:var(--bg-input);border:1px solid var(--border);border-radius:var(--radius);color:var(--text);padding:10px;font-family:monospace;font-size:0.85rem;"></textarea>
        <button class="btn btn-sm btn-outline" style="margin-top:8px;" onclick="copyKeys()">Copy All</button>
      </div>
    </div>

    <div class="card">
      <h2>Users</h2>
      <div class="search-bar">
        <input type="text" id="searchInput" placeholder="Search by username or email..." oninput="searchUsers()">
        <select id="roleFilter" onchange="searchUsers()">
          <option value="">All Roles</option>
          <option value="user">User</option>
          <option value="prem-user">Prem-User</option>
          <option value="media">Media</option>
          <option value="admin">Admin</option>
          <option value="developer">Developer</option>
        </select>
      </div>
      <div style="overflow-x:auto;">
        <table>
          <thead>
            <tr>
              <th>Username</th>
              <th>Email</th>
              <th>Role</th>
              <th>HWID</th>
              <th>Created</th>
              <th>Actions</th>
            </tr>
          </thead>
          <tbody id="usersTable"></tbody>
        </table>
      </div>
      <div class="pagination" id="pagination"></div>
    </div>
  </div>

  <script>
    const token = localStorage.getItem('token');
    if (!token) { window.location.href = '/login'; }

    let currentPage = 1;

    function showError(msg) {
      const el = document.getElementById('error');
      el.textContent = msg; el.style.display = 'block';
      setTimeout(() => el.style.display = 'none', 5000);
    }

    function showSuccess(msg) {
      const el = document.getElementById('success');
      el.textContent = msg; el.style.display = 'block';
      setTimeout(() => el.style.display = 'none', 5000);
    }

    async function api(path, opts = {}) {
      opts.headers = { ...opts.headers, 'Authorization': 'Bearer ' + token, 'Content-Type': 'application/json' };
      const res = await fetch(path, opts);
      if (res.status === 401) { localStorage.clear(); window.location.href = '/login'; return null; }
      const data = await res.json();
      if (!res.ok) { showError(data.error || 'Request failed'); return null; }
      return data;
    }

    async function init() {
      try {
        const data = await api('/api/user/profile');
        if (!data || (data.role !== 'admin' && data.role !== 'developer')) {
          window.location.href = '/dashboard';
          return;
        }
        document.getElementById('userBadge').textContent = data.username;
        loadStats();
        loadUsers();
        loadJarInfo();
      } catch (e) {
        window.location.href = '/dashboard';
      }
    }

    async function loadStats() {
      const d = await api('/api/admin/stats');
      if (!d) return;
      document.getElementById('statUsers').textContent = d.total_users;
      document.getElementById('statActive').textContent = d.active_subs;
      document.getElementById('statUsedKeys').textContent = d.total_keys_used;
      document.getElementById('statToday').textContent = d.users_today;
    }

    async function loadUsers(page) {
      if (page) currentPage = page;
      const search = document.getElementById('searchInput').value;
      const role = document.getElementById('roleFilter').value;
      const params = new URLSearchParams({ page: currentPage, limit: 20 });
      if (search) params.set('search', search);
      if (role) params.set('role', role);
      const d = await api('/api/admin/users?' + params);
      if (!d) return;

      const tbody = document.getElementById('usersTable');
      tbody.innerHTML = '';
      d.users.forEach(function(u) {
        const tr = document.createElement('tr');
        tr.innerHTML = '<td>' + u.username + '</td>' +
          '<td style="font-size:0.85rem;">' + u.email + '</td>' +
          '<td><span class="badge badge-' + (u.role === 'developer' ? 'dev' : u.role) + '">' + u.role + '</span></td>' +
          '<td style="font-family:monospace;font-size:0.8rem;">' + (u.hwid ? u.hwid.substring(0, 16) + '...' : '-') + '</td>' +
          '<td style="font-size:0.85rem;">' + new Date(u.created_at).toLocaleDateString() + '</td>' +
          '<td><button class="btn btn-sm btn-outline" onclick="showUser(\'' + u.id + '\')">Manage</button> ' +
          '<button class="btn btn-sm ' + (u.banned ? 'btn-success' : 'btn-danger') + '" onclick="toggleBan(\'' + u.id + '\')">' + (u.banned ? 'Unban' : 'Ban') + '</button></td>';
        tbody.appendChild(tr);
      });

      var totalPages = Math.ceil(d.total / d.limit);
      var pag = document.getElementById('pagination');
      pag.innerHTML = '';
      for (var i = 1; i <= totalPages && i <= 10; i++) {
        var btn = document.createElement('button');
        btn.textContent = i;
        btn.onclick = (function(page) { return function() { loadUsers(page); }; })(i);
        if (i === currentPage) btn.style.borderColor = 'var(--accent)';
        pag.appendChild(btn);
      }
    }

    function searchUsers() { loadUsers(1); }

    function showUser(id) {
      var action = prompt('Actions:\n 1 - Give sub\n 2 - Revoke sub\n 3 - Change role\n 4 - Reset HWID\nEnter number:');
      if (!action) return;
      if (action === '1') {
        var days = prompt('Duration in days:');
        if (!days) return;
        api('/api/admin/users/' + id + '/give-sub', { method: 'POST', body: JSON.stringify({ duration_days: parseInt(days) }) })
          .then(function() { showSuccess('Subscription given.'); loadUsers(); });
      } else if (action === '2') {
        api('/api/admin/users/' + id + '/revoke-sub', { method: 'POST' })
          .then(function() { showSuccess('Subscription revoked.'); loadUsers(); });
      } else if (action === '3') {
        var role = prompt('New role (user, prem-user, media, admin, developer):');
        if (!role) return;
        api('/api/admin/users/' + id + '/change-role', { method: 'POST', body: JSON.stringify({ role: role }) })
          .then(function() { showSuccess('Role changed.'); loadUsers(); });
      } else if (action === '4') {
        api('/api/admin/users/' + id + '/reset-hwid', { method: 'POST' })
          .then(function() { showSuccess('HWID reset.'); loadUsers(); });
      }
    }

    function toggleBan(id) {
      api('/api/admin/users/' + id + '/ban', { method: 'POST' })
        .then(function() { showSuccess('Done.'); loadUsers(); });
    }

    async function generateKeys() {
      var count = parseInt(document.getElementById('keyCount').value);
      var duration = parseInt(document.getElementById('keyDuration').value);
      if (count < 1 || duration < 1) { showError('Invalid values.'); return; }
      var d = await api('/api/admin/generate-keys', {
        method: 'POST', body: JSON.stringify({ count: count, duration_days: duration })
      });
      if (!d) return;
      document.getElementById('keysText').value = d.keys.join('\n');
      document.getElementById('keysOutput').style.display = 'block';
      showSuccess('Generated ' + d.keys.length + ' keys.');
    }

    function copyKeys() {
      var ta = document.getElementById('keysText');
      ta.select();
      navigator.clipboard.writeText(ta.value);
      showSuccess('Copied!');
    }

    async function loadJarInfo() {
      var res = await fetch('/api/client/jar-info', { headers: { 'Authorization': 'Bearer ' + token } });
      var data = await res.json();
      var el = document.getElementById('jarInfo');
      el.textContent = data.exists ? 'Current JAR: ' + (data.size / 1024 / 1024).toFixed(1) + ' MB' : 'No JAR uploaded yet.';
    }

    async function uploadJar() {
      var file = document.getElementById('jarInput').files[0];
      if (!file) { showError('Select a JAR file first.'); return; }
      var formData = new FormData();
      formData.append('jar', file);
      var res = await fetch('/api/client/upload-jar', {
        method: 'POST', headers: { 'Authorization': 'Bearer ' + token }, body: formData
      });
      var data = await res.json();
      if (!res.ok) { showError(data.error || 'Upload failed'); return; }
      showSuccess('JAR uploaded!');
      loadJarInfo();
    }

    function logout() {
      fetch('/api/auth/logout', { method: 'POST', headers: { 'Authorization': 'Bearer ' + token } })
        .catch(function() {}).finally(function() { localStorage.clear(); window.location.href = '/login'; });
    }

    init();
  </script>
</body>
</html>
