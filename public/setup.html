<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Setup - Developer</title>
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <div class="container" style="max-width:420px;">
    <div style="text-align:center;margin:40px 0 20px;">
      <a href="/" class="header-logo" style="font-size:2rem;">AppleSkin</a>
    </div>
    <div class="card">
      <h2 style="text-align:center;">Developer Setup</h2>
      <p style="color:var(--text-secondary);font-size:0.9rem;text-align:center;margin-bottom:16px;">
        One-time setup. Only works if no developer exists yet.
      </p>
      <div id="error" class="alert alert-error" style="display:none;"></div>
      <div id="success" class="alert alert-success" style="display:none;"></div>
      <form id="setupForm">
        <div class="form-group">
          <label>Secret Key</label>
          <input type="password" id="secret" required placeholder="Enter setup key">
        </div>
        <button type="submit" class="btn btn-primary" style="width:100%;margin-top:8px;">Make Me Developer</button>
      </form>
      <p style="text-align:center;margin-top:16px;">
        <a href="/dashboard" style="color:var(--accent);font-size:0.9rem;">Back to Dashboard</a>
      </p>
    </div>
  </div>
  <script>
    const token = localStorage.getItem('token');
    if (!token) { window.location.href = '/login'; }

    document.getElementById('setupForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const errEl = document.getElementById('error');
      const sucEl = document.getElementById('success');
      errEl.style.display = 'none';
      sucEl.style.display = 'none';
      const btn = e.target.querySelector('button');
      btn.disabled = true; btn.textContent = 'Loading...';

      try {
        const res = await fetch('/api/admin/setup', {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
            'Authorization': 'Bearer ' + token,
          },
          body: JSON.stringify({ secret: document.getElementById('secret').value }),
        });
        const data = await res.json();
        if (!res.ok) throw new Error(data.error || 'Failed');
        sucEl.textContent = 'Success! You are now a developer. Redirecting...';
        sucEl.style.display = 'block';
        localStorage.removeItem('user');
        setTimeout(() => window.location.href = '/admin', 1500);
      } catch (err) {
        errEl.textContent = err.message;
        errEl.style.display = 'block';
      } finally {
        btn.disabled = false; btn.textContent = 'Make Me Developer';
      }
    });
  </script>
</body>
</html>
